<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SignalShift360{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    Signal Shift 360
    <span class="dummy-tag">AI Risk & Impact Analysis</span>
  </div>
  <nav>
    <a href="/{% if qs %}?{{ qs }}{% endif %}" class="{{ 'active' if request.url.path == '/' else '' }}">Agent Run Panel</a>
    <a href="/dashboard{% if qs %}?{{ qs }}{% endif %}" class="{{ 'active' if request.url.path == '/dashboard' else '' }}">Dashboard</a>
    <a href="/insights{% if qs %}?{{ qs }}{% endif %}" class="{{ 'active' if request.url.path == '/insights' else '' }}">Insights &amp; Recommendations</a>
    <a href="/export{% if qs %}?{{ qs }}{% endif %}" class="{{ 'active' if request.url.path == '/export' else '' }}">Export</a>
  </nav>
</header>

<main class="content">
{% block content %}{% endblock %}
</main>
</body>
</html>
